name: test
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same branch replaces the older run, so a hung run never holds the branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the plugin version check diffs against the PR's base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # plugins/harness/lib/ledger is committed build output; fail when it differs from a fresh build.
      - run: npm run build:plugin -- --check
      # A change under plugins/harness must raise its plugin.json version: the version names the build.
      - if: github.event_name == 'pull_request'
        run: node scripts/check-plugin-version.mjs origin/${{ github.base_ref }}
      - run: npm test
      # SPEC.md is generated from the machine JSON; fail when the committed copy is not a fresh render.
      - run: npm run spec:render -w @ccp/harness && git diff --exit-code
      - run: npm run scenarios
      # Browser only: ubuntu-latest already has Chromium's libraries, and --with-deps spent its whole
      # timeout fetching fonts from a slow apt mirror. Fail fast if the download stalls.
      - run: npx playwright install chromium
        timeout-minutes: 6
      - run: npm run pages:check -w @ccp/harness -- --shots shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-shots
          path: packages/harness/shots
